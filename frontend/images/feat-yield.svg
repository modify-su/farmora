<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 72" fill="#ffffff">
  <!-- Soil mound -->
  <path d="M 6 63 C 12 59 18 57 24 59 C 30 61 36 57 42 60 C 44 62 44 65 6 65 Z" />
  <!-- Sprout Stem -->
  <path d="M 23 61 C 23 45 25 32 27 21" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <!-- Top Leaf -->
  <path d="M 27 21 C 26 11 37 7 42 8 C 43 18 34 23 27 21 Z" />
  <!-- Left Leaf -->
  <path d="M 24 41 C 15 40 7 33 8 24 C 17 23 24 31 24 41 Z" />
  <!-- Right Leaf -->
  <path d="M 25 44 C 31 44 38 38 39 30 C 31 30 25 36 25 44 Z" />
  <!-- Gear -->
  <g transform="translate(58, 45)">
    <circle cx="0" cy="0" r="14.5" />
    <rect x="-3.5" y="-18" width="7" height="36" rx="2" />
    <rect x="-18" y="-3.5" width="36" height="7" rx="2" />
    <rect x="-3.5" y="-18" width="7" height="36" rx="2" transform="rotate(45)" />
    <rect x="-18" y="-3.5" width="36" height="7" rx="2" transform="rotate(45)" />
    <!-- Gear center hole -->
    <circle cx="0" cy="0" r="5.5" fill="#00a64c" />
    <circle cx="0" cy="0" r="9.5" fill="none" stroke="#00a64c" stroke-width="2.2" />
  </g>
  <!-- 3 Upward Growth Arrows -->
  <!-- Left Arrow -->
  <path d="M 47 28 L 47 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 43 19 L 47 13 L 51 19" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Center Arrow (Taller) -->
  <path d="M 58 24 L 58 8" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 53 13 L 58 5 L 63 13" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Right Arrow -->
  <path d="M 69 28 L 69 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 65 19 L 69 13 L 73 19" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
